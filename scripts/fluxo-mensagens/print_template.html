<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
@page { size: A4 portrait; margin: 14mm 12mm 16mm; }
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:11px;color:#1e293b;margin:0}
header.doc{text-align:center;border-bottom:2px solid #0f172a;padding-bottom:8px;margin-bottom:14px}
header.doc h1{font-size:15px;margin:0 0 2px;color:#0f172a}
header.doc p{margin:0;color:#64748b;font-size:10px}
section.flow{page-break-before:always}
section.flow:first-of-type{page-break-before:auto}
section.flow h2{font-size:13px;color:#fff;padding:5px 10px;border-radius:6px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
section.flow h2 .cnt{font-weight:400;font-size:10px;opacity:.9}
.card{break-inside:avoid;border:1px solid #cbd5e1;border-left:5px solid #94a3b8;border-radius:6px;padding:7px 10px;margin-bottom:7px}
.card h3{margin:0 0 3px;font-size:11.5px}
.badge{display:inline-block;font-size:8.5px;padding:0 6px;border-radius:999px;margin-left:5px;vertical-align:1px;font-weight:600;color:#0f172a}
.badge.opcao{background:#bfdbfe}.badge.termo{background:#ddd6fe}.badge.pesquisa{background:#a7f3d0}
.badge.equipe{background:#fed7aa}.badge.fim{background:#e2e8f0}.badge.nota{background:#fde68a}.badge.msg{background:#99f6e4}
.body{margin:0;white-space:pre-line;color:#334155}
.out{margin-top:4px;color:#64748b;font-size:10px}
.out b{color:#b45309}
.foot{position:fixed;bottom:-12mm;left:0;right:0;text-align:center;font-size:8px;color:#94a3b8}
</style>
</head>
<body>
<header class="doc">
<h1>__TITLE__</h1>
<p>Todas as mensagens e passos do fluxograma original, organizados por fluxo e na ordem de leitura.</p>
</header>
<!--__FLOWS__-->
<div class="foot">Documento gerado a partir do fluxograma original. Conteúdo inalterado.</div>
</body>
</html>
